<circle cx="344.5" cy="125.1" r="6" fill="#1f2937" stroke="#1f2937" stroke-width="1.4"/>
<circle cx="501.7" cy="120.5" r="6" fill="#16a34a" stroke="#16a34a" stroke-width="1.4"/>
