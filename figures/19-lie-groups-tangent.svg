<text x="511.7" y="144.5" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="normal">R·Exp(δ)</text>
<text x="40.0" y="205.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">切空间（向量空间，可以加减）</text>
<text x="641.5" y="219.3" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#2563eb" text-anchor="start" font-weight="normal">旋转流形 SO(3)（弯的，不能直接加）</text>
