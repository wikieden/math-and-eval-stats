<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="16.0" y="26.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#1f2937" text-anchor="start" font-weight="bold">Exp 与 Log：在切平面上加，在流形上落脚</text>
<text x="16.0" y="330.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">曲线示意旋转流形（真实的 SO(3) 是 3 维的）。在 R 处贴一条切线（切空间）；切向量 δ 沿切线走，Exp 把它“卷”回流形上的 R·Exp(δ)；Log 反过来。</text>
