<rect width="100%" height="100%" fill="#ffffff"/>
<text x="16.0" y="26.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#1f2937" text-anchor="start" font-weight="bold">伯努利 KL(p ‖ q) 和它的二次近似 ½F(q − p)²</text>
<text x="16.0" y="310.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">实线是真实 KL，虚线是 ½F(q − p)²（F = 1/(p(1 − p))）。在 p 附近两者重合；离开 p 越远、越靠近边界，真实 KL 涨得越快。</text>
