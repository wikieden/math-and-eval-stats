<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="16.0" y="26.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#1f2937" text-anchor="start" font-weight="bold">压缩映射：每套一次 T，任意两个值函数的距离至少缩 γ 倍</text>
<text x="16.0" y="290.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">‖TV − TU‖∞ ≤ γ‖V − U‖∞。从任何 V₀、U₀ 出发，距离 γ, γ², γ³… 地缩到 0，所以不动点 V* 唯一，值迭代从哪出发都收敛。</text>
