<text x="16.0" y="290.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">横轴分数差 Δr = r_a − r_b。蓝：P(a ≻ b) = σ(Δr)；橙：a 被偏好时奖励模型的损失 −log σ(Δr)，Δr 越大损失越小，Δr &lt; 0（判反了）时损失近似线性增长。</text>
