<text x="16.0" y="360.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">中间的黑块是障碍物，每个格子里的数是到最近障碍格的欧氏距离（格子数），颜色越深越近。机器人半径 r 的碰撞检测就是查“ESDF &lt; r”。</text>
