<text x="430.0" y="160.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">A · X = X · B</text>
</svg>
