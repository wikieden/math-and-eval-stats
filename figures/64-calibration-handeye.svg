<svg xmlns="http://www.w3.org/2000/svg" width="860" height="320" viewBox="0 0 860 320">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="16.0" y="26.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#1f2937" text-anchor="start" font-weight="bold">手眼标定的环路：AX = XB</text>
<text x="16.0" y="310.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">A：末端的相对运动（正运动学）；B：相机的相对运动（看标定板的 PnP）；X：末端 → 相机的外参，两次都一样。“先 A 再 X”和“先 X 再 B”到达同一个相机位姿。</text>
<rect x="120.0" y="200.0" width="150.0" height="50.0" rx="8" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4" opacity="1"/>
<text x="195.0" y="229.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">末端 · 位姿 1</text>
<rect x="590.0" y="200.0" width="150.0" height="50.0" rx="8" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4" opacity="1"/>
<text x="665.0" y="229.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">末端 · 位姿 2</text>
<rect x="120.0" y="60.0" width="150.0" height="50.0" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4" opacity="1"/>
<text x="195.0" y="89.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">相机 · 位姿 1</text>
<rect x="590.0" y="60.0" width="150.0" height="50.0" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4" opacity="1"/>
<text x="665.0" y="89.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">相机 · 位姿 2</text>
<line x1="270.0" y1="225.0" x2="590.0" y2="225.0" stroke="#2563eb" stroke-width="2"/>
<polygon points="590.0,225.0 582.1,229.2 582.1,220.8" fill="#2563eb" stroke="#2563eb" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<rect x="382.4" y="208.5" width="95.2" height="16.5" rx="3" fill="#ffffff" stroke="none" stroke-width="1.4" opacity="0.9"/>
<text x="430.0" y="220.5" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#2563eb" text-anchor="middle" font-weight="normal">A（机械臂运动）</text>
<line x1="270.0" y1="85.0" x2="590.0" y2="85.0" stroke="#ea580c" stroke-width="2"/>
<polygon points="590.0,85.0 582.1,89.2 582.1,80.8" fill="#ea580c" stroke="#ea580c" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<rect x="388.2" y="68.5" width="83.7" height="16.5" rx="3" fill="#ffffff" stroke="none" stroke-width="1.4" opacity="0.9"/>
<text x="430.0" y="80.5" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#ea580c" text-anchor="middle" font-weight="normal">B（相机运动）</text>
<line x1="195.0" y1="200.0" x2="195.0" y2="110.0" stroke="#7c3aed" stroke-width="2"/>
<polygon points="195.0,110.0 199.2,117.9 190.8,117.9" fill="#7c3aed" stroke="#7c3aed" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<rect x="187.7" y="138.5" width="14.7" height="16.5" rx="3" fill="#ffffff" stroke="none" stroke-width="1.4" opacity="0.9"/>
<text x="195.0" y="150.5" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#7c3aed" text-anchor="middle" font-weight="normal">X</text>
<line x1="665.0" y1="200.0" x2="665.0" y2="110.0" stroke="#7c3aed" stroke-width="2"/>
<polygon points="665.0,110.0 669.2,117.9 660.8,117.9" fill="#7c3aed" stroke="#7c3aed" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<rect x="657.7" y="138.5" width="14.7" height="16.5" rx="3" fill="#ffffff" stroke="none" stroke-width="1.4" opacity="0.9"/>
