<text x="16.0" y="290.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">r(n) = γ(log n / n)^{1/2}（d = 2、γ = 6，蓝）；虚线是 γ(1/n)^{1/2}（缩得更快，期望邻居数不随 n 增长，会失去渐近最优）。</text>
