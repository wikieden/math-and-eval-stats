<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>泛函分析入门</title><link rel="stylesheet" href="anim.css">
<style>svg text.cap{font-size:15px;font-weight:500}svg text.num{font-size:15px;font-weight:600}svg text.s{font-size:12px}</style></head>
<body><main>
<h1>第 30 章 · 两把尺子、Fourier 逼近、不动点蛛网图</h1>
<p class="sub">配套讲义：<a href="../lessons/30-functional-analysis.html">第 30 章 · 泛函分析入门：赋范空间、Banach 与 Hilbert 空间、算子与谱、不动点定理、RKHS</a>。xⁿ 的 sup 范数和 L² 范数；方波 sign(x) 的正弦级数部分和；x ← cos x 的不动点迭代。</p>
<div class="panel"><svg id="sv" viewBox="0 0 680 360"></svg></div>
<div class="row"><button id="play">▶ 播放</button><button id="step">→ 单步</button><button id="reset">↺ 从头开始</button></div>
<div class="row"><label for="md">演示</label><select id="md"><option value="0">xⁿ 的两种范数</option><option value="1">Fourier 逼近</option><option value="2">cos 不动点</option></select><label for="v">n / 项数 / 迭代次数</label><input type="range" id="v" min="1" max="60" step="1" value="1"><span id="vv">1</span></div>
<p class="note">看点：① xⁿ：n 变大，曲线贴向横轴，L² 范数变小但 sup 范数一直是 1；② Fourier：项数加多，曲线越来越贴方波，跳变处的过冲（约 9%）始终在；③ cos 不动点：蛛网折线在 y = cos x 和 y = x 之间来回，收向交点 0.739。</p>
</main>
<script src="anim.js"></script>
<script>
const sv=$('sv');
function R(x,y,w,h,col,op){return el('rect',{x,y,width:Math.max(w,1),height:Math.max(h,1),rx:3,fill:col,opacity:op??.75},sv)}
function T(s,x,y,a,c){return txt(s,{x,y,'text-anchor':a||'start',class:c||'m'},sv)}
function C(x,y,r,col,op){return el('circle',{cx:x,cy:y,r,fill:col,opacity:op??.8},sv)}
function L(x1,y1,x2,y2,col,w,dash){return el('line',{x1,y1,x2,y2,stroke:col,'stroke-width':w||1.5,'stroke-dasharray':dash||''},sv)}
function P(pts,col,w,dash){return el('polyline',{points:pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' '),fill:'none',stroke:col,'stroke-width':w||2,'stroke-dasharray':dash||'','stroke-linejoin':'round'},sv)}
function AR(x1,y1,x2,y2,col,w){L(x1,y1,x2,y2,col,w||1.8);const a=Math.atan2(y2-y1,x2-x1),h=7;el('polygon',{points:[[x2,y2],[x2-h*Math.cos(a-0.45),y2-h*Math.sin(a-0.45)],[x2-h*Math.cos(a+0.45),y2-h*Math.sin(a+0.45)]].map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' '),fill:col},sv)}
function cap(s){T(s,340,24,'middle','cap')}
function PM(x0,y0,w,h,xr,yr){return (x,y)=>[x0+(x-xr[0])/(xr[1]-xr[0])*w,y0+h-(y-yr[0])/(yr[1]-yr[0])*h]}
function CL(m,x0,y0,w,h){return (a,b)=>{const q=m(a,b);return[Math.min(Math.max(q[0],x0),x0+w),Math.min(Math.max(q[1],y0),y0+h)]}}
function frame(x0,y0,w,h){el('rect',{x:x0,y:y0,width:w,height:h,fill:'none',stroke:'var(--line)','stroke-width':1},sv)}
const BETA=[],AB=[];{let a=1;for(let i=0;i<1000;i++){const b=1e-4+(0.02-1e-4)*i/999;BETA.push(b);a*=1-b;AB.push(a)}}
const abar=t=>t<=0?1:AB[Math.min(Math.round(t),1000)-1];
function spiral(n,s){seed(s||5);const p=[];for(let i=0;i<n;i++){const th=1.5*Math.PI*(1+2*rnd());p.push([th*Math.cos(th)/10,th*Math.sin(th)/10])}return p}
function noise(n,s){seed(s||9);const p=[];for(let i=0;i<n;i++)p.push([gauss(),gauss()]);return p}
const MEMO={};function memo(k,f){if(!(k in MEMO))MEMO[k]=f();return MEMO[k]}
const GET=ids=>ids.map(i=>{const e=$(i);return e.type==='checkbox'?+e.checked:+e.value});
function SET(ids,v){ids.forEach((i,k)=>{const e=$(i);if(e.type==='checkbox')e.checked=!!v[k];else e.value=v[k];const o=$(i+'v');if(o)o.textContent=(+v[k]).toString()})}
const IDS=['md','v'],F=[[0,1],[0,5],[0,20],[0,60],[1,1],[1,3],[1,10],[1,40],[2,1],[2,3],[2,10],[2,30]];
function render(md,v){v=+v;if(md==0){frame(40,40,600,280);const M=PM(40,40,600,280,[0,1],[0,1.05]);const p=[];for(let i=0;i<=300;i++){const x=i/300;p.push(M(x,x**v))}
  const fill=p.concat([M(1,0),M(0,0)]);el('polygon',{points:fill.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' '),fill:'var(--accent)',opacity:.15},sv);P(p,'var(--accent)',2.5);
  cap(`x^${v}：sup 范数 1，L² 范数 1/√(2n + 1) = ${(1/Math.sqrt(2*v+1)).toFixed(4)}`)}
 else if(md==1){frame(40,40,600,280);const M=PM(40,40,600,280,[-Math.PI,Math.PI],[-1.4,1.4]);const sq=[],s=[];let err=0;
  for(let i=0;i<=600;i++){const x=-Math.PI+2*Math.PI*i/600;let y=0;for(let k=1;k<=v;k++)y+=4/Math.PI*Math.sin((2*k-1)*x)/(2*k-1);s.push(M(x,y));sq.push(M(x,Math.sign(x)));err+=(Math.sign(x)-y)**2*2*Math.PI/600}
  P(sq,'var(--muted)',3);P(s,'var(--accent)',2);cap(`前 ${v} 项：L² 误差² ≈ ${err.toFixed(4)}`)}
 else{const n=Math.min(v,40);frame(40,40,600,280);const M=PM(40,40,600,280,[0,1.1],[0,1.1]);const c=[];for(let i=0;i<=100;i++){const x=1.1*i/100;c.push(M(x,Math.cos(x)))}P(c,'var(--accent)',2.5);P([M(0,0),M(1.1,1.1)],'var(--muted)',1.5,'4 3');
  let x=1;const w=[M(x,0)];for(let i=0;i<n;i++){const y=Math.cos(x);w.push(M(x,y));w.push(M(y,y));x=y}P(w,'var(--warm)',1.5);const q=M(x,x);C(q[0],q[1],5,'var(--bad)',1);
  T('y = cos x',M(0.05,1.0)[0],M(0,1.0)[1]-6,'start','s');T('y = x',M(1.0,1.0)[0]-30,M(0,1.0)[1]+18,'start','s');cap(`${n} 次迭代：x = ${x.toFixed(6)}（不动点 0.739085）`)}}
let k=0,custom=null;
function draw(){clear(sv);const v=custom||F[k];SET(IDS,v);render(...v)}
function reset(){k=0;custom=null;draw()}
function next(){if(custom!==null){custom=null;draw();return true}if(k>=F.length-1)return false;k++;draw();return true}
IDS.forEach(i=>{const e=$(i);const f=()=>{ANIM.stop();custom=GET(IDS);draw()};e.oninput=f;e.onchange=f});
setupPlayer({captureSeed:1,reset,next},1600);
</script><a href="https://wikieden.github.io/ai-books/" style="position:fixed;right:12px;bottom:12px;z-index:99;padding:4px 10px;border-radius:14px;background:rgba(127,127,127,.18);color:inherit;font:13px/1.6 system-ui,sans-serif;text-decoration:none">← 全部讲义书</a>
</body></html>
